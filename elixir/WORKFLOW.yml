project:
  id: symphony
  key: SYM

source:
  remote: origin

board:
  remote:

agent:
  max_concurrent_agents: 10
  ssh_hosts: []

codex:
  command: codex --config shell_environment_policy.inherit=all app-server
  approval_policy: never
  sandbox: workspace-write
  network_access: true

prompts:
  base: workflow/prompts/base.md
  context: workflow/prompts/context.md

jobs:
  targeted_validation:
    executable: ./elixir/scripts/symphony-targeted-validation.sh
    arguments: []
    passthrough_arguments: required
    environment: {}
  full_validation:
    executable: ./elixir/scripts/symphony-full-validation.sh
    arguments: []
    passthrough_arguments: forbidden
    environment: {}

stages:
  implementation:
    prompt: workflow/prompts/implementation.md
    workpad: workflow/workpads/implementation.md
    allowed_model_efforts:
      gpt-5.5: [xhigh]
  automated_review:
    prompt: workflow/prompts/automated_review.md
    workpad: workflow/workpads/automated_review.md
    allowed_model_efforts:
      gpt-5.5: [xhigh]
  rework:
    prompt: workflow/prompts/rework.md
    workpad: workflow/workpads/rework.md
    allowed_model_efforts:
      gpt-5.5: [xhigh]
  merge_conflict:
    prompt: workflow/prompts/merge_conflict.md
    workpad: workflow/workpads/merge_conflict.md
    allowed_model_efforts:
      gpt-5.5: [xhigh]

columns:
  - id: backlog
    name: Backlog
    role: pause
    initial: true
  - id: todo
    name: Todo
    role: dispatch
    stage: implementation
    on_claim: in_progress
  - id: in_progress
    name: In Progress
    role: dispatch
    stage: implementation
  - id: automated_review
    name: Automated Review
    role: dispatch
    stage: automated_review
  - id: human_review
    name: Human Review
    role: pause
    publish_workpad: true
    mark_pr_ready: true
  - id: rework
    name: Rework
    role: dispatch
    stage: rework
  - id: merge_conflict
    name: Merge Conflict
    role: dispatch
    stage: merge_conflict
  - id: merging
    name: Merging
    role: merge
  - id: blocked
    name: Blocked
    role: blocked
  - id: done
    name: Done
    role: terminal
    successful: true
    satisfies_dependencies: true
  - id: cancelled
    name: Cancelled
    role: terminal

transitions:
  human:
    backlog: [todo, cancelled]
    todo: [backlog, cancelled]
    in_progress: [blocked, cancelled]
    automated_review: [blocked, cancelled]
    human_review: [rework, cancelled]
    rework: [blocked, cancelled]
    merge_conflict: [blocked, cancelled]
    merging: []
    blocked: []
    done: []
    cancelled: []
  agent:
    backlog: []
    todo: []
    in_progress: [automated_review, blocked]
    automated_review: [human_review, rework, blocked]
    human_review: []
    rework: [automated_review, blocked]
    merge_conflict: [automated_review, blocked]
    merging: []
    blocked: []
    done: []
    cancelled: []

merge:
  method: squash
  readiness_command: ./elixir/scripts/symphony-merge-readiness.sh
  review_column: automated_review
  conflict_column: merge_conflict

hooks:
  before_run: cd elixir && mise exec -- mix deps.get
  before_remove: cd elixir && mise exec -- mix workspace.before_remove
